services:
  postgres:
    image: postgres:17-alpine
    ports:
      # Reachable from this machine only: the password below is not a secret.
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school
      POSTGRES_DB: school
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
