name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # The tests use Testcontainers to start a temporary Postgres; GitHub's Ubuntu runners come with Docker.
      - run: npm test
      # The admin pages are a package of their own: their tests run in jsdom, and the build makes admin/dist.
      - run: npm --prefix admin ci
      - run: npm run admin:test
      - run: npm run admin:build
