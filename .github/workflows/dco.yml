name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check that every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            name=$(git log -1 --format='%an' "$sha")
            email=$(git log -1 --format='%ae' "$sha")
            # 机器人（比如 Dependabot）的提交不检查。
            case "$name" in *'[bot]') continue ;; esac
            if ! git log -1 --format='%B' "$sha" | grep -i '^Signed-off-by:' | grep -Fqi "<$email>"; then
              echo "::error::提交 ${sha:0:7}（作者 $name <$email>）缺少签名：Signed-off-by: $name <$email>"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "请用 git commit -s 提交。补签已有的提交：git rebase --signoff $BASE，然后 git push --force-with-lease。详见 CONTRIBUTING.md。"
            exit 1
          fi
