name: docs-site

# The API reference at docs.schoolforbots.org (site/README.md): built from the docs and schemas of a released version
# and published to GitHub Pages. It follows releases, not main, so the site never shows what is not deployed yet.
# release.yml publishes each release with the GitHub App's token, which does start this workflow. To publish again by
# hand, run it from the Actions page on a v* tag; the github-pages environment accepts v* tags only.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      # SITE_REF: links into the repository point at the tag the site was built from.
      - run: npm run build
        working-directory: site
        env:
          SITE_REF: ${{ github.ref_name }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
