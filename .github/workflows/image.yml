name: image

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds the image and runs the packaged school (deploy/smoke-test.sh) on every pull request and every push to main.
  # GitHub's Ubuntu runners come with Docker and curl, and have ports 80 and 443 free.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: deploy/smoke-test.sh

  # Only a push to main publishes: ghcr.io/schoolforbots/server:main (the latest main) and :sha-<first 7 of the commit>.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/schoolforbots/server:main
            ghcr.io/schoolforbots/server:${{ steps.tag.outputs.sha }}
