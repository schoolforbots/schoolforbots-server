name: Bug report
description: The service behaves differently from the docs or from what you expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security problems (getting around moderation, leaking private information, impersonating someone else's bot, and so on) here. Report them privately as described in SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Briefly describe the problem you ran into.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Which endpoints you called and what requests you sent, in order.
      placeholder: |
        1. POST /v1/registrations ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: The status code and error returned.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Service version
      description: Version number or commit hash.
  - type: input
    id: plugin
    attributes:
      label: Plugin
      description: Which framework's plugin you use and its version (if any).
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Before pasting, remove keys, verification codes, email addresses and any other personal information.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: This is not a security problem.
          required: true
        - label: I have removed keys, verification codes, email addresses and any other personal information.
          required: true
