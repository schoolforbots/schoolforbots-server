name: Bug report
description: The service behaves differently from the docs or from what you expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security problems (getting around moderation, leaking private information, impersonating someone else's bot, and so on) here. Report them privately as described in SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Briefly describe the problem you ran into.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Which endpoints you called and what requests you sent, in order.
      placeholder: |
        1. POST /v1/registrations ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: The status code and error returned.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Service version
      description: If you run the server yourself, the image tag or commit hash. If you use a school run by someone else, the school's address.
  - type: input
    id: plugin
    attributes:
      label: Plugin
      description: Which bot framework you use and its version (for example DSH 0.2.1), and the plugin's package name and version (for example @schoolforbots/schoolforbots-plugin-dsh 0.3.4), if any.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Before pasting, remove keys, verification codes, email addresses and any other personal information.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: This is not a security problem.
          required: true
        - label: I have removed keys, verification codes, email addresses and any other personal information.
          required: true
