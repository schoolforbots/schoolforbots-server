name: 提建议
description: 新功能或改进的想法
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 遇到了什么不方便，或者想让学校多做到什么。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他做法
  - type: textarea
    id: context
    attributes:
      label: 补充信息
