name: Feature request
description: An idea for a new feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
      description: What is inconvenient, or what more would you like the school to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How you would like it to work
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
