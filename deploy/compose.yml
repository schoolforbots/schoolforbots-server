# The school in production: one image run as three services, a database, a proxy that holds the certificate, a watchdog
# and the nightly backup. Start and update it with deploy.sh. The variables below come from the .env next to this file
# (see env.example); the backup's settings come from backup.env (see backup.env.example).

x-logging: &logging
  # The server's journald keeps the logs; how long is set there, not here.
  driver: journald

# Memory limits: one service that leaks is stopped (and restarted) on its own, before the machine runs out and the
# kernel picks something to kill, the database perhaps. Each is well above what the service was seen to use at its
# busiest (1200 students in class and 900 in the club at once, a lesson with 4000 students), and no swap is allowed on
# top of it (memswap_limit), so a leak ends there rather than paging the whole machine slow. The heap of each Node
# service stays well below its limit, so it collects its garbage harder before the limit is reached.
x-service: &service
  image: ghcr.io/schoolforbots/server:${IMAGE_TAG:?set IMAGE_TAG in .env}
  env_file: .env
  # PID 1 of its own: a TERM while the service is still starting reaches it, rather than being ignored.
  init: true
  mem_limit: 512m
  memswap_limit: 512m
  environment: &service-environment
    NODE_ENV: production
    NODE_OPTIONS: --max-old-space-size=320
    TRUST_PROXY: '1'
    SCHOOL_CONFIG: /app/private/school.json
    PROMPTS_DIR: /app/private/prompts
    MODERATION_DATA_DIR: /app/private/moderation
  volumes:
    - ${SCHOOL_PRIVATE_DIR:?set SCHOOL_PRIVATE_DIR in .env}:/app/private:ro
  restart: unless-stopped
  logging: *logging
  labels:
    school.watchdog: 'true'

services:
  postgres:
    image: postgres:17-alpine
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      POSTGRES_USER: school
      POSTGRES_DB: school
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U school -d school']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging

  # Migrates the database when it starts, and serves the admin pages.
  registration:
    <<: *service
    command: ['node', 'dist/registration/main.js']
    environment:
      <<: *service-environment
      REGISTRATION_PORT: '8080'
    healthcheck:
      test: ['CMD', 'node', 'dist/tools/healthcheck.js', '8080']
      interval: 30s
      timeout: 5s
      retries: 3
      # It listens only once the migrations are done. A long one must not make it unhealthy, or the watchdog restarts
      # it halfway, again and again. The first check that passes ends the start period, so it costs nothing after.
      # deploy.sh waits at least this long for it.
      start_period: 10m
    # Its 10 seconds to stop, and some to spare, before Docker kills it.
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  # Waits for the migrations of the registration service before it starts.
  class:
    <<: *service
    command: ['node', 'dist/class/main.js']
    environment:
      <<: *service-environment
      CLASS_PORT: '8081'
    healthcheck:
      test: ['CMD', 'node', 'dist/tools/healthcheck.js', '8081']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Its 10 seconds to stop, and some to spare, before Docker kills it.
    stop_grace_period: 20s
    depends_on:
      registration:
        condition: service_healthy

  # Waits for the migrations of the registration service before it starts. When it stops, the games being played are
  # played out by the trustee and stored first: up to club.recordDrainSeconds (10 by default) on top of the 10 seconds
  # every service has to stop, so it gets longer than Docker's default 10 seconds before it is killed.
  club:
    <<: *service
    command: ['node', 'dist/club/main.js']
    environment:
      <<: *service-environment
      CLUB_PORT: '8082'
    healthcheck:
      test: ['CMD', 'node', 'dist/tools/healthcheck.js', '8082']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s
    depends_on:
      registration:
        condition: service_healthy

  caddy:
    image: caddy:2
    # It holds every WebSocket connection: about 600 MiB with 4000.
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      SCHOOL_DOMAIN: ${SCHOOL_DOMAIN:?set SCHOOL_DOMAIN in .env}
      CADDY_TLS_LINE: ''
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - registration
      - class
      - club
    restart: unless-stopped
    logging: *logging

  # Every day at BACKUP_AT (Shanghai time) dumps the database, encrypts it with the public key BACKUP_AGE_RECIPIENT and
  # uploads it to S3-compatible storage; see backup/backup.sh. One backup on demand:
  #   docker compose run --rm backup backup.sh
  # Built on the server from backup/Dockerfile; the private key is never here. Its BACKUP_ settings are in backup.env,
  # which no other service reads: the storage key can delete backups, so it stays out of the services that face the
  # internet. Only DATABASE_URL comes from .env.
  backup:
    build: ./backup
    # PID 1 of its own: docker stop reaches a running backup as a TERM, not after a silent kill.
    init: true
    mem_limit: 256m
    memswap_limit: 256m
    env_file: backup.env
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  # Restarts a service whose health check keeps failing. Only a container that is running: one stopped by hand stays
  # stopped.
  watchdog:
    image: docker:29-cli
    mem_limit: 64m
    memswap_limit: 64m
    entrypoint: ['sh', '/watchdog.sh']
    environment:
      WATCHDOG_INTERVAL: '30'
    volumes:
      - ./watchdog.sh:/watchdog.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  caddy_logs:
