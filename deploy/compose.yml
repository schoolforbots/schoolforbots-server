# The school in production: one image run as two services, a database, a proxy that holds the certificate, a watchdog
# and the nightly backup. Start and update it with deploy.sh. The variables below come from the .env next to this file
# (see env.example).

x-logging: &logging
  # The server's journald keeps the logs; how long is set there, not here.
  driver: journald

x-service: &service
  image: ghcr.io/schoolforbots/server:${IMAGE_TAG:?set IMAGE_TAG in .env}
  env_file: .env
  environment: &service-environment
    NODE_ENV: production
    TRUST_PROXY: '1'
    SCHOOL_CONFIG: /app/private/school.json
    PROMPTS_DIR: /app/private/prompts
    MODERATION_DATA_DIR: /app/private/moderation
  volumes:
    - ${SCHOOL_PRIVATE_DIR:?set SCHOOL_PRIVATE_DIR in .env}:/app/private:ro
  restart: unless-stopped
  logging: *logging
  labels:
    school.watchdog: 'true'

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: school
      POSTGRES_DB: school
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U school -d school']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging

  # Migrates the database when it starts, and serves the admin pages.
  registration:
    <<: *service
    command: ['node', 'dist/registration/main.js']
    environment:
      <<: *service-environment
      REGISTRATION_PORT: '8080'
    healthcheck:
      test: ['CMD', 'node', 'dist/tools/healthcheck.js', '8080']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  # Waits for the migrations of the registration service before it starts.
  class:
    <<: *service
    command: ['node', 'dist/class/main.js']
    environment:
      <<: *service-environment
      CLASS_PORT: '8081'
    healthcheck:
      test: ['CMD', 'node', 'dist/tools/healthcheck.js', '8081']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      registration:
        condition: service_healthy

  caddy:
    image: caddy:2
    environment:
      SCHOOL_DOMAIN: ${SCHOOL_DOMAIN:?set SCHOOL_DOMAIN in .env}
      CADDY_TLS_LINE: ''
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - registration
      - class
    restart: unless-stopped
    logging: *logging

  # Every day at BACKUP_AT (Shanghai time) dumps the database, encrypts it with the public key BACKUP_AGE_RECIPIENT and
  # uploads it to S3-compatible storage; see backup/backup.sh. One backup on demand:
  #   docker compose run --rm backup backup.sh
  # Built on the server from backup/Dockerfile; the private key is never here.
  backup:
    build: ./backup
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      BACKUP_AT: ${BACKUP_AT:-03:30}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  # Restarts a service whose health check keeps failing. Only a container that is running: one stopped by hand stays
  # stopped.
  watchdog:
    image: docker:29-cli
    entrypoint: ['sh', '/watchdog.sh']
    environment:
      WATCHDOG_INTERVAL: '30'
    volumes:
      - ./watchdog.sh:/watchdog.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  caddy_logs:
